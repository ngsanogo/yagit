# yagit's toolchain.
#
# mise (https://mise.jdx.dev) is the project's only prerequisite: it installs
# the tools below and runs the project's tasks (`mise tasks` lists them;
# `./do <task>` is a shortcut for `mise run <task>`).
#
# Versions live HERE and nowhere else. A version pinned in two places always
# ends up drifting.
#
# Every version below is exact — never a floating major or minor. `node = "22"`
# once stood here: the lockfile froze it on the 22.x of the day it was written,
# later patches of that line never arrived, and nothing in this file said which
# one was meant. A version a person can read is the version that is installed.
#
# mise.lock beside this file is not a second source: it is a SHA256 for each of
# these versions on every platform, so a contributor joining next month gets
# the same bytes as CI — and a download that does not match is refused instead
# of installed. Same relationship as package.json to pnpm-lock.yaml.
#
# Changing a version here updates the lockfile for THIS platform on the next
# `mise install`. Run `mise lock` to refresh all of them; CI goes red on a
# lockfile that only covers the machine it was edited on.
#
# Playwright is deliberately absent: it is a dev dependency of the
# frontend, pinned in web/package.json, and listing it here too would recreate
# exactly that duplication.

# mise itself. An older mise refuses to read this file at all — "mise version
# X is required, but you are using Y" — so `./do` never installs the toolchain
# with a mise older than CI's, and CI runs exactly this one.
#
# Top-level, above the first table: below one, TOML files it under that table
# and mise never sees it. The workflows repeat it as `version:` on every
# jdx/mise-action step, because the action installs mise before anything can
# read this file: move them together.
min_version = "2026.10.2"

[settings]
# Keep mise.lock current automatically.
#
# Without this, adding a tool above installs it with no locked checksum and
# nothing says so — the lockfile silently stops covering everything. With it,
# `mise install` rewrites mise.lock, and CI's "working tree must stay clean"
# check turns a stale lockfile into a red build instead of a quiet gap.
lockfile = true

[tools]
# The daemon. Must match the `go` directive in go.mod.
go = "1.27.3"

# The frontend.
node = "26.13.0"

# The frontend's package manager. Pinned here like every other tool, because
# Node stopped shipping corepack with 25 and nothing else would fetch it.
#
# web/package.json repeats the version in `packageManager`, which makes it one
# of two values this file does not hold alone — min_version above is the
# other. pnpm reads that field, and web/pnpm-workspace.yaml tells it to refuse
# a mismatch rather than download the other version — so the two cannot drift
# without the first command saying so.
pnpm = "12.16.1"

# Hot reload for the daemon during `./do dev` (see .air.toml).
air = "1.67.4"

# Static analysis for Go (see .golangci.yml).
golangci-lint = "2.14.0"

# Static analysis for the shell scripts (./do, scripts/*.sh).
shellcheck = "0.11.0"

# Static analysis for the GitHub workflows. A typo in a workflow file is only
# discovered when the workflow runs, which is exactly when you least want to
# find out.
actionlint = "1.7.12"

# Security analysis for the GitHub workflows. actionlint above reads them as
# YAML and as shell; zizmor reads them as an attack surface — an unpinned
# action, a `${{ }}` interpolated into a `run:` block, a token scoped wider
# than the job needs. Two tools because they answer two different questions.
zizmor = "1.31.1"

# Go's vulnerability scanner, run by `./do audit`.
#
# Nothing else here looks at the Go side's exposure the same way. Dependabot
# watches go.mod, which is one direct dependency deep — fsnotify, and the
# golang.org/x/sys it brings with it — and stops there. Every line of this
# daemon also runs on the standard library, and net/http and the crypto
# packages get advisories like anything else. govulncheck reads the Go
# vulnerability database, standard library included, and — unlike a version
# comparison — checks whether the vulnerable function is reachable from this
# code, so what it reports is what can actually be exploited here.
#
# This one carries a version in mise.lock but no checksum, unlike every other
# tool here. It is installed by `go install`, which verifies the module against
# sum.golang.org — a transparency log, which is a stronger guarantee than a
# hash we wrote down ourselves, not a weaker one.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

# ---------------------------------------------------------------------------
# Tasks: `mise run <task>` (or `./do <task>`). `mise tasks` lists them.
# ---------------------------------------------------------------------------

# This machine's settings, optional (see .env.example).
[env]
_.file = ".env"

[tasks.bootstrap]
description = "Install the frontend dependencies"
run = "pnpm --dir web install --frozen-lockfile"

[tasks."bootstrap:browsers"]
description = "Install the Chromium the end-to-end tests drive"
depends = ["bootstrap"]
run = "pnpm --dir web exec playwright install chromium"

# The daemon (rebuilt by air on every saved Go file) may open repositories under
# YAGIT_ROOT (your home directory unless .env says otherwise), and proxies
# everything outside /api to Vite, so the browser only ever talks to http://127.0.0.1:7420. The
# token is the checkout's (scripts/session-token.mjs), so a rebuild does not log
# the browser out.
[tasks.dev]
description = "Run the daemon (hot reload) and Vite in the foreground"
depends = ["dev:daemon", "dev:web"]

[tasks."dev:daemon"]
hide = true
env = { YAGIT_ROOT = "{{ env.YAGIT_ROOT | default(value=env.HOME | default(value=env.USERPROFILE)) }}", YAGIT_ADDR = "{% if env.YAGIT_LISTEN_ALL %}0.0.0.0{% else %}127.0.0.1{% endif %}:7420", YAGIT_FRONTEND_DEV_SERVER = "http://127.0.0.1:7421", YAGIT_TOKEN = "{{ exec(command='node scripts/session-token.mjs') }}" }
run = "air -c .air.toml"

[tasks."dev:web"]
hide = true
depends = ["bootstrap"]
env = { YAGIT_VITE_PORT = "7421" }
run = "pnpm --dir web run dev"

[tasks.up]
description = "Start the development stack in the background and print its URL and token"
run = "sh scripts/stack.sh up"

[tasks.down]
description = "Stop the background stack"
run = "sh scripts/stack.sh down"

[tasks.status]
description = "Report whether the background stack is running"
run = "sh scripts/stack.sh status"

[tasks.logs]
description = "Follow the background stack's output"
run = "sh scripts/stack.sh logs"

[tasks.token]
description = "Print the session token (--new mints another)"
quiet = true
run = "node scripts/session-token.mjs"

[tasks.build]
description = "Build the frontend, then the binaries for every platform into dist/"
depends = ["bootstrap"]
run = "sh scripts/build.sh"

[tasks.test]
description = "Go, frontend and end-to-end tests"
depends = ["test:go", "test:web"]
run = "mise run test:e2e"

[tasks."test:go"]
description = "Go tests, with the race detector"
run = "go test -race ./cmd/... ./internal/..."

[tasks."test:web"]
description = "Frontend unit tests"
depends = ["bootstrap"]
run = "pnpm --dir web run test"

[tasks."test:e2e"]
description = "Playwright against the development stack (started for the run if it is not up)"
depends = ["bootstrap:browsers"]
run = "pnpm --dir web run test:e2e"

[tasks."test:release"]
description = "Playwright against the built binary for this machine (after `mise run build`)"
depends = ["bootstrap:browsers"]
run = "pnpm --dir web run test:release"

[tasks."test:coverage"]
description = "Go and frontend coverage"
depends = ["bootstrap"]
run = [
  "go test -race -covermode=atomic -coverprofile=.yagit/coverage.out ./cmd/... ./internal/...",
  "go tool cover -func=.yagit/coverage.out | tail -n 1",
  "pnpm --dir web run test:coverage",
]

[tasks."test:bench"]
description = "Go benchmarks"
run = "go test -run '^$' -bench . -benchmem ./internal/..."

[tasks.lint]
description = "Static analysis: Go (every platform), frontend, shell, workflows"
depends = ["bootstrap"]
run = [
  "golangci-lint run",
  "GOOS=darwin go vet ./cmd/... ./internal/...",
  "GOOS=windows go vet ./cmd/... ./internal/...",
  "pnpm --dir web run lint",
  "pnpm --dir web run fmt:check",
  "shellcheck --shell=sh do scripts/*.sh",
  "actionlint",
  "zizmor --offline --persona pedantic .github",
]

[tasks.audit]
description = "Check Go and frontend dependencies against the vulnerability databases"
depends = ["bootstrap"]
run = ["govulncheck ./cmd/... ./internal/...", "pnpm --dir web audit --audit-level=low"]

[tasks.fmt]
description = "Reformat the code"
depends = ["bootstrap"]
run = ["golangci-lint fmt", "pnpm --dir web run fmt"]

[tasks.shot]
description = "Screenshot a page of the running stack: [url] [file.png]"
depends = ["bootstrap:browsers"]
env = { YAGIT_TOKEN = "{{ exec(command='node scripts/session-token.mjs') }}" }
run = "node web/scripts/shot.mjs"

[tasks.drive]
description = "Drive the running interface from stdin: [url]"
raw = true
depends = ["bootstrap:browsers"]
env = { YAGIT_TOKEN = "{{ exec(command='node scripts/session-token.mjs') }}" }
run = "node web/scripts/driver.mjs"

[tasks.version]
description = "Print the version the next release would carry (nothing if none)"
quiet = true
run = "sh scripts/next-version.sh"
