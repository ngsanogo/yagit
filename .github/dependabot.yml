version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    # A compromised release is usually caught and yanked within days. A
    # cooldown means Dependabot never proposes a version that has not survived
    # a week of everyone else's scrutiny — which is the window a poisoned
    # release of a widely installed package gets to spread in before anyone
    # notices.
    #
    # A week of latency on a dependency bump costs nothing. Being the first
    # repository to install a poisoned package costs everything.
    cooldown:
      default-days: 7

    groups:
      # The linter and the compiler move as one, major versions included.
      #
      # oxlint declares oxlint-tsgolint as a peer dependency with a floor, and
      # oxlint-tsgolint carries its own TypeScript 7 to read types with — the
      # same language `tsc --noEmit` checks from the typescript package. One
      # pull request for the three keeps the linter, the checker inside it and
      # the compiler beside it on the same TypeScript; one per package is one
      # chance per package to merge a third of that.
      tooling:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - typescript
        update-types: [major, minor, patch]

      # vitest and its plugins move as one, major versions included.
      #
      # @vitest/coverage-v8 requires the exact vitest version it was released
      # with, so each of the two arrived alone as a pull request that could not
      # even install: vitest 5 came as #15 and #16, both red on `npm ci`
      # ERESOLVE, and landed together by hand in #17. The updater puts a
      # dependency in the FIRST group that matches it, so this group has to
      # stay above `frontend`, whose `*` would otherwise take the minors.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
        update-types: [major, minor, patch]

      # Everything else, minor and patch only: fifteen separate pull requests
      # for routine bumps is not review, it is noise.
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

    ignore:
      # @types/node must track the node major pinned in mise.toml, or the types
      # describe APIs the runtime does not have. Bump it when node moves, not
      # before.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

    # See the npm block above.
    cooldown:
      default-days: 7


  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

    # See the npm block above.
    cooldown:
      default-days: 7

