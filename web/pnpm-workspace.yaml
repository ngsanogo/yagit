# pnpm's settings for the frontend. Each closes a door pnpm leaves open by
# default.

# pnpm compares itself with `packageManager` in package.json, and by default
# answers a mismatch by downloading the other version and running that — a
# binary mise.lock never checked. mise.toml is where the version is chosen;
# when the two disagree the answer is to say so, not to pick one quietly.
pmOnFail: error

# `pnpm run` checks node_modules against the lockfile first, and by default
# answers a mismatch by installing — which rewrites pnpm-lock.yaml to agree
# with whatever package.json says. ./do installs with --frozen-lockfile so
# that the lockfile only ever changes on purpose; a script that repairs it on
# the way past would be the same quiet rewrite by another route.
verifyDepsBeforeRun: error

# `pnpm add` writes the version it resolved, not a range around it. Every
# entry in package.json is an exact version: a range there is a second answer
# to "which one?", and the lockfile is supposed to be the only place that
# question has to be looked up.
savePrefix: ''

# source-map-js 1.2.1 is GHSA-68fv-2mgg-jv7q (event-loop denial of service).
# @tailwindcss/node 4.3.3 and magicast 0.5.5 still require 1.2.1; postcss
# already resolved 1.2.2. Neither parent has published a release that asks
# for the patch, so the pin is forced here until they do.
overrides:
  source-map-js: 1.2.2
